name: plan-gcp

on:
  pull_request:
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/plan-gcp.yml"

# why: GitHub needs id-token to issue the JWT that GCP verifies
permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform plan -no-color -lock-timeout=60s | tee plan.txt

      - if: success()
        run: tail -n 5 plan.txt >> "$GITHUB_STEP_SUMMARY"
